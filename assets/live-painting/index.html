<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live UniMelb painting</title>
  <style>
    /* This page is only a frame for the painting. On your own site, the two
       lines that matter are the script tag and the element below. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ddd6c8;
    }

    unimelb-painting {
      width: min(1200px, calc(100% - 32px));
      margin: 24px 0;
      box-shadow: 0 1px 2px rgb(60 45 20 / 0.25), 0 18px 40px rgb(60 45 20 / 0.22);
    }
  </style>
  <script src="unimelb-painting/unimelb-painting.js" defer></script>
</head>
<body>
  <unimelb-painting></unimelb-painting>
</body>
</html>
