<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Contact — SLGS</title>
    <meta name="description" content="Contact the Sri Lankan Graduates’ Society (SLGS) and connect via email or social media." />

    <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="../../assets/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="atmos" aria-hidden="true"></div>

    <div data-header data-header-page="contact"></div>

    <main id="content" class="container" tabindex="-1">
      <section class="section">
        <div class="section-head reveal">
          <div>
            <h2>Contact</h2>
            <p>Reach us by email or follow our social channels for updates.</p>
          </div>
        </div>

        <div class="grid cols-2">
          <div class="feature ring reveal">
            <h3>Email</h3>
            <p>For membership, events, or partnerships, email the SLGS committee.</p>
            <div style="height: 10px"></div>
            <a class="btn ring btn--primary" href="mailto:slgsunimelb@gmail.com">slgsunimelb@gmail.com</a>
          </div>

          <div class="feature reveal">
            <h3>Social media</h3>
            <p>Follow our socials for announcements, events, and updates.</p>
            <div style="height: 10px"></div>
            <div class="pills" aria-label="Social media">
              <a class="pill" href="https://www.facebook.com/slgsmelb/" target="_blank" rel="noreferrer">Facebook</a>
              <a class="pill" href="https://www.instagram.com/slgs.unimelb/" target="_blank" rel="noreferrer">Instagram</a>
            </div>
          </div>
        </div>
      </section>

      <div data-footer></div>
    </main>

    <script src="../../assets/js/app.js" defer></script>
  </body>
</html>
